spring.application.name=niwrad

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/chatdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Database (commented out)
# spring.datasource.url=jdbc:h2:mem:chatdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.h2.console.enabled=true

# JWT
jwt.secret=your-256-bit-secret-key-here-make-it-long-enough-for-hs256-algorithm
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# WebSocket Configuration for large messages (images)
spring.servlet.multipart.max-file-size=75MB
spring.servlet.multipart.max-request-size=75MB
server.tomcat.max-http-post-size=75MB
